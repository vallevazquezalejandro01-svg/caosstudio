<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caos Studio</title>
<style>

	@font-face {
		font-family: 'neue';
		src: url('font/neue/NeueHaasDisplayRoman.ttf');
	}

	@font-face {
		font-family: 'neue_bold_italic';
		src: url('font/neue/NeueHaasDisplayRomanItalic.ttf');
	}

	body {
		background: white;
		margin: 0;
	}

	.container {
		height: 100vh;
		width: 100%;
		overflow: hidden;
		position: relative;
	}

	.header {
		display: flex;
		justify-content: space-between;
		align-items: center;
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		z-index: 10;
		padding: 0 30px;
	}

	.logo img {
		width: 70px;
	}

	.menu {
		display: flex;
	}

	.menu a {
		padding: 10px;
		font-size: 20px;
		font-family: 'Neue', sans-serif;
		text-decoration: none;
		color: black;
	}
	
	.contacto {
    position: absolute;
    top: 50%;
    left: 100px;
    transform: translateY(-50%);
}

	.titulo{
		font-family: 'neue';
		color: #E00000;
		font-size: 70px;
		font-weight: 400;
	
	}
	
	.subtitulo{
		font-family: 'neue';
		color: black;
		font-size: 50px;
		margin-top: -50px;
		margin-bottom: 60px;
		font-weight: 400;
	}
	
	.links {
		font-family: 'neue';
		color: gray;
		font-size: 50px;
		
	}
	
	.links p {
    margin: 0;
    line-height: 1.2;
}
	.links a {
		text-decoration: none;
		color: black;
		
	}
	
	@media (max-width: 600px) {
		.abajo {
			flex-direction: column;
			gap: 10px;
		}
	}
	
	@media (max-width: 768px) {

    .contacto {
        left: 30px;
        right: 30px;
    }

    .titulo {
        font-size: 40px;
    }

    .subtitulo {
        font-size: 28px;
        margin-top: -20px;
        margin-bottom: 30px;
    }

    .links {
        font-size: 22px;
    }

    .menu a {
        font-size: 15px;
        padding: 5px;
    }

    .logo img {
        width: 50px;
    }

}

</style>
</head>
<body>

	<div class="header">
		<div class="logo">
			<a href="index.html">
			<img src="img/logo.png" alt="logotipo">

		<div class="menu">
			<a href="works.html">Proyectos</a>
			<a href="about.html">Sobre mi</a>

		</div>
	</div>

	<h1 class="subtitulo">Alejandro Valle Vázquez </h1>
		
		
    <div class="links">
